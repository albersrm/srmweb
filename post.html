<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRM - Sonido Real Magazine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1><a href="index.html">SRM — Sonido Real Magazine</a></h1>
  </header>

  <main id="post-container">
    <article>
      <h2 id="post-title"></h2>
      <p class="meta"><span id="post-date"></span> | <span id="post-category"></span></p>
      <img id="post-image" src="" alt="Imagen del post" />
      <p class="caption" id="post-caption"></p>
      <div id="post-content"></div>
    </article>
  </main>

  <footer>
    <p>&copy; 2025 SRM</p>
  </footer>

  <script>
    // Obtener el ID del post desde la URL
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    fetch("posts.json")
      .then(response => response.json())
      .then(posts => {
        const post = posts.find(p => p.id === postId);
        if (post) {
          document.getElementById("post-title").textContent = post.titulo;
          document.getElementById("post-date").textContent = post.fecha;
          document.getElementById("post-category").textContent = post.categoria;
          document.getElementById("post-image").src = "img/" + post.imagen;
          document.getElementById("post-caption").textContent = "Imagen: " + post.imagen;
          document.getElementById("post-content").textContent = post.contenido;
        } else {
          document.getElementById("post-container").innerHTML = "<p>Post no encontrado.</p>";
        }
      });
  </script>
</body>
</html>
