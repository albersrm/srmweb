<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRM | Artículo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    #post-image {
      max-width: 100%;
      margin: 20px 0;
      display: none;
      border-radius: 10px;
    }
    #image-credit {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 1.5rem;
      font-style: italic;
      display: none;
    }
    #post-content p {
      line-height: 1.6;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h1 id="post-title">Cargando...</h1>
  <img id="post-image" alt="Imagen del post" />
  <p id="image-credit"></p>
  <div id="post-content"></div>

  <script>
    // Obtener el parámetro id de la URL
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    fetch('posts.json')
      .then(response => response.json())
      .then(posts => {
        const post = posts.find(p => p.id === postId);

        if (!post) {
          document.body.innerHTML = "<h2>Artículo no encontrado</h2>";
          return;
        }

        document.getElementById('post-title').textContent = post.title || 'Sin título';
        document.getElementById('post-content').innerHTML = post.content || '<p>Sin contenido</p>';

        if(post.image) {
          const img = document.getElementById('post-image');
          img.src = post.image;
          img.alt = post.title || 'Imagen del post';
          img.style.display = 'block';
        }

        if(post.imageCredit) {
          const credit = document.getElementById('image-credit');
          credit.textContent = post.imageCredit;
          credit.style.display = 'block';
        }
      })
      .catch(error => {
        document.body.innerHTML = "<h2>Error cargando el artículo</h2>";
        console.error(error);
      });
  </script>
</body>
</html>
