<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post - SRM - Revista Online de Música</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1 id="post-title">Cargando título...</h1>
  </header>

  <main>
    <article id="post-content">
      <img id="post-image" src="" alt="Imagen del post" />
      <p id="post-excerpt">Cargando contenido...</p>
    </article>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    fetch('posts.json')
      .then(res => res.json())
      .then(posts => {
        const post = posts.find(p => p.id == postId);
        if (post) {
          document.getElementById('post-title').textContent = post.title;
          document.getElementById('post-image').src = post.image || 'img/default.jpg';
          document.getElementById('post-image').alt = post.title || 'Imagen del post';
          document.getElementById('post-excerpt').textContent = post.content || 'Contenido no disponible.';
        } else {
          document.getElementById('post-content').textContent = 'Post no encontrado.';
        }
      })
      .catch(() => {
        document.getElementById('post-content').textContent = 'Error cargando el post.';
      });
  </script>

</body>
</html>
