<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRM - Post</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 800px;
      padding: 0 20px;
      color: #222;
    }
    h1 {
      font-size: 2.2rem;
      color: #000;
    }
    .fecha, .categoria, .etiquetas {
      font-size: 0.9rem;
      color: #777;
    }
    img {
      max-width: 100%;
      margin: 20px 0;
    }
    .caption {
      font-size: 0.8rem;
      color: #888;
      margin-top: -15px;
      margin-bottom: 25px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1 id="titulo"></h1>
  <p class="fecha" id="fecha"></p>
  <p class="categoria" id="categoria"></p>
  <p class="etiquetas" id="etiquetas"></p>
  <img id="post-image" src="" alt="Imagen del post" />
  <p class="caption" id="post-creditos"></p>
  <p id="contenido"></p>

  <script>
    // Obtener parámetros de URL (ejemplo: post.html?id=post1)
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    fetch("posts.json")
      .then(response => response.json())
      .then(data => {
        const post = data.find(p => p.id === postId);
        if (!post) {
          document.body.innerHTML = "<h2>Post no encontrado</h2>";
          return;
        }

        document.getElementById("titulo").textContent = post.titulo;
        document.getElementById("fecha").textContent = post.fecha;
        document.getElementById("categoria").textContent = "Categoría: " + post.categoria;
        document.getElementById("etiquetas").textContent = "Etiquetas: " + post.etiquetas.join(", ");
        document.getElementById("contenido").textContent = post.contenido;

        if (post.imagen) {
          document.getElementById("post-image").src = "img/" + post.imagen;
        }
        if (post.creditos) {
          document.getElementById("post-creditos").textContent = post.creditos;
        }
      })
      .catch(error => {
        document.body.innerHTML = "<h2>Error cargando el post</h2>";
        console.error(error);
      });
  </script>
</body>
</html>
