<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRM | Artículo</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    img {
      max-width: 100%;
      margin: 1rem 0;
      border-radius: 10px;
    }
    .credit {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 2rem;
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <h1 id="post-title">Cargando...</h1>
  <img id="post-image" src="" alt="" style="display:none;" />
  <p class="credit" id="post-credit" style="display:none;"></p>
  <div id="post-content"></div>

  <script>
    // Obtener el ID del post desde la URL
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    // Cargar el archivo JSON
    fetch('posts.json')
      .then(response => response.json())
      .then(posts => {
        const post = posts.find(p => p.id === postId);
        if (!post) {
          document.getElementById('post-title').innerText = 'Artículo no encontrado';
          return;
        }

        document.getElementById('post-title').innerText = post.title;

        if (post.image) {
          const img = document.getElementById('post-image');
          img.src = post.image;
          img.alt = post.title;
          img.style.display = 'block';
        }

        if (post.credit) {
          const credit = document.getElementById('post-credit');
          credit.innerText = post.credit;
          credit.style.display = 'block';
        }

        document.getElementById('post-content').innerHTML = post.content;
      })
      .catch(error => {
        document.getElementById('post-title').innerText = 'Error al cargar el artículo';
        console.error(error);
      });
  </script>
</body>
</html>
