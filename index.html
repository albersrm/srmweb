<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8" /><title>Test Index</title></head>
<body>
  <div id="test-title"></div>

  <script>
    fetch('posts.json')
      .then(r => r.json())
      .then(posts => {
        document.getElementById('test-title').textContent = posts[0].title || 'No title found';
      });
  </script>
</body>
</html>
